<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recomendador de Peliculas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1>Recomendador de Peliculas - Jorge Francisco</h1>
    <p class="subtitle">Elige tu rango de edad y descubre peliculas para ti.</p>
  </header>

  <main class="main-container">
    <section class="search-panel">
      <h2>Cual es tu edad?</h2>
      <div class="category-buttons" id="opciones">
        <button type="button" class="btn-category" data-edad="2-12">2 a 12</button>
        <button type="button" class="btn-category" data-edad="13-17">13 a 17</button>
        <button type="button" class="btn-category" data-edad="18+">18 o mas</button>
      </div>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>Peliculas recomendadas</h2>
        <span id="resultsCount" class="results-counter">Selecciona una edad</span>
      </div>
      <div id="resultsGrid" class="results-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <a href="../index.html">Volver al portal</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
